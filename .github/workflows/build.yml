name: Build and publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    name: Handwriting model (CoMER -> ONNX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache exported model
        id: cache
        uses: actions/cache@v4
        with:
          path: model-out
          key: comer-onnx-${{ hashFiles('model/export_onnx.py') }}

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"

      - name: Export and evaluate
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/Green-Wood/CoMER /tmp/CoMER
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install onnx==1.17.0 onnxruntime==1.20.1 pytorch-lightning==2.4.0 einops pillow opencv-python-headless 2>&1 | tail -n 5
          mkdir -p model-out
          set -o pipefail
          python model/export_onnx.py /tmp/CoMER model-out 300 2>&1 | tee model-out/export.log
          echo "::notice title=Model::$(grep ExpRate model-out/export.log)"

      - name: Report failure
        if: failure()
        run: python3 .github/annotate.py model-out/export.log

      - name: Model report
        run: tail -n 25 model-out/export.log >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: |
            model-out/encoder.onnx
            model-out/decoder.onnx
            model-out/vocab.txt

  android:
    name: Android APK
    needs: model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: model
          path: app/src/main/assets/model

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Engine tests
        run: |
          pip install sympy==1.13.3
          set -o pipefail
          python tests/test_engine.py 2>&1 | tee build.log

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk calculator.apk
          ls -la calculator.apk

      - name: Report failure
        if: failure()
        run: python3 .github/annotate.py build.log

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Калькулятор 1.0.${{ github.run_number }}
          body: |
            Сборка из коммита ${{ github.sha }}.
            Постоянная ссылка на последнюю версию:
            https://github.com/${{ github.repository }}/releases/latest/download/calculator.apk
          files: calculator.apk
          make_latest: "true"

  device-test:
    name: Emulator test
    needs: model
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: model
          path: app/src/main/assets/model

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build x86_64 APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease -Pabis=x86_64 2>&1 | tee build.log

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          script: python3 tests/device_test.py app/build/outputs/apk/release/app-release.apk device-out 2>&1 | tee build.log

      - name: Report failure
        if: failure()
        run: python3 .github/annotate.py build.log

      - name: Publish test report to branch ci-device-test
        if: always()
        run: |
          [ -d device-out ] || exit 0
          cp build.log device-out/ 2>/dev/null || true
          cd device-out
          git init -q -b ci-device-test
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Device test for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-device-test
          echo "::notice title=Device test::$(tail -n 1 ../build.log)"
